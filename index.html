<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#121110">
	<meta name="description" content="Practice routines with a ramping metronome and a foot-pedal ✓/✗ record for every run.">
	<title>Metronome</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffb224'/%3E%3Cpath d='M11 26 16 5l5 21z' fill='none' stroke='%23121110' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='m16 18 6-9' stroke='%23121110' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>

<body>
	<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

	<!-- ───────────── Sign in / create account ───────────── -->
	<section id="auth" class="auth">
		<div class="mast"><span class="wordmark">Metronome</span></div>
		<div class="auth-body">
			<form id="auth-form" class="auth-form" novalidate>
				<h1 id="auth-title">Sign in</h1>
				<p class="auth-lede">Your routines and every ✓/✗ run, synced across your devices.</p>
				<label class="field"><span>Email</span>
					<input id="auth-email" type="email" autocomplete="email" required>
				</label>
				<label class="field"><span>Password</span>
					<input id="auth-password" type="password" autocomplete="current-password" required minlength="8">
				</label>
				<p id="auth-error" class="form-error" role="alert"></p>
				<button id="auth-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
				<p id="auth-status" class="form-status" aria-live="polite"></p>
				<button id="auth-toggle" class="btn-link" type="button">New here? Create an account</button>
			</form>
		</div>
	</section>

	<!-- ───────────── Email verification ───────────── -->
	<section id="verify" class="auth" hidden>
		<div class="mast"><span class="wordmark">Metronome</span></div>
		<div class="auth-body">
			<form id="verify-form" class="auth-form" novalidate>
				<h1>Check your email</h1>
				<p id="verify-instructions" class="auth-lede">Enter the 6-digit code we emailed you.</p>
				<label class="field"><span>Code</span>
					<input id="verify-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
				</label>
				<p id="verify-error" class="form-error" role="alert"></p>
				<button id="verify-submit" class="btn btn-primary btn-block" type="submit">Verify email</button>
				<div class="form-row">
					<button id="verify-resend" class="btn-link" type="button">Send a new code</button>
					<button id="verify-back" class="btn-link" type="button">Back to sign in</button>
				</div>
			</form>
		</div>
	</section>

	<!-- ───────────── Routines ───────────── -->
	<section id="builder" class="builder" hidden>
		<header class="mast">
			<span class="wordmark">Metronome</span>
			<span id="sync-indicator" class="sync" aria-live="polite">Synced</span>
			<button id="signOutBtn" class="btn" type="button">Sign out</button>
		</header>
		<div class="builder-inner">
			<div class="builder-head">
				<h1>Routines</h1>
				<button id="addPracticeBtn" class="btn btn-primary" type="button">New routine</button>
			</div>
			<p id="alltime" class="alltime"></p>
			<div class="view-bar">
				<div class="seg" role="group" aria-label="Routine layout">
					<button id="view-list" class="seg-btn" type="button" aria-pressed="true">List</button>
					<button id="view-slide" class="seg-btn" type="button" aria-pressed="false">Slide</button>
				</div>
				<div id="pager" class="pager" hidden>
					<button id="slide-prev" class="btn btn-quiet btn-icon" type="button" aria-label="Previous routine"></button>
					<span id="slide-pos" class="slide-pos" aria-live="polite"></span>
					<button id="slide-next" class="btn btn-quiet btn-icon" type="button" aria-label="Next routine"></button>
				</div>
			</div>
			<div id="app"></div>
			<div id="slide-dots" class="slide-dots" hidden></div>
		</div>
		<div class="record-bar" role="region" aria-label="Record a run">
			<div class="record-bar-inner">
				<p class="record-target"><span id="record-target"></span><span id="bar-pending" class="pending" hidden>Pending… tap again for ✗</span></p>
				<button id="bar-good" class="rec-btn rec-good" type="button" aria-label="Good run"></button>
				<button id="bar-bad" class="rec-btn rec-bad" type="button" aria-label="Bad run"></button>
				<button id="bar-undo" class="btn btn-quiet btn-icon" type="button" aria-label="Undo last record"></button>
			</div>
		</div>
	</section>

	<!-- ───────────── Player ───────────── -->
	<section id="player" class="player" hidden>
		<header class="player-top">
			<button id="stop" class="btn btn-quiet" type="button"></button>
			<div id="player-title" class="player-title" tabindex="-1"></div>
			<span id="player-pos" class="player-pos"></span>
		</header>

		<div class="player-main">
			<ol id="stops" class="stops" aria-label="Sections"></ol>

			<div class="tempo">
				<p id="label" class="section-name"></p>
				<div class="bpm-row">
					<button id="minus" class="bpm-step" type="button" aria-label="Slower (−1 BPM)"></button>
					<div id="bpm-display" class="bpm" role="slider" tabindex="0" aria-label="Tempo" aria-valuemin="20" aria-valuemax="300" aria-valuenow="120">120</div>
					<button id="plus" class="bpm-step" type="button" aria-label="Faster (+1 BPM)"></button>
				</div>
				<p id="bpm-unit" class="bpm-unit">BPM</p>
				<div class="beats" aria-hidden="true">
					<span class="beat accent" id="dot-0"></span>
					<span class="beat" id="dot-1"></span>
					<span class="beat" id="dot-2"></span>
					<span class="beat" id="dot-3"></span>
				</div>
				<p id="song-line" class="song-line" aria-live="polite" hidden></p>
			</div>

			<div class="time">
				<span id="remaining" class="remaining">0:00</span>
				<div class="progress" aria-hidden="true">
					<div id="progress-bar" class="progress-bar"></div>
				</div>
				<p id="upcoming-details" class="upcoming"></p>
			</div>

			<div class="transport">
				<button id="prevBtn" class="btn btn-icon" type="button" aria-label="Previous section"></button>
				<button id="playPause" class="btn btn-icon play" type="button" aria-label="Pause"></button>
				<button id="nextBtn" class="btn btn-icon" type="button" aria-label="Next section"></button>
			</div>

			<div class="tally">
				<div class="tally-head">
					<span id="pedal-pending" class="pending" hidden>Pending… tap again for ✗</span>
					<span id="pedal-hint" class="pedal-hint">Pedal: tap ✓ · double ✗ · hold undo</span>
					<button id="undoBtn" class="btn btn-quiet" type="button"></button>
				</div>
				<div id="stats-ui" class="panels">
					<button id="success-zone" class="panel panel-good" type="button">
						<span class="panel-label"><span class="ico-good"></span>Good</span>
						<span id="success-count" class="panel-count">0</span>
						<span id="success-sub" class="panel-sub"></span>
					</button>
					<button id="fail-zone" class="panel panel-bad" type="button">
						<span class="panel-label"><span class="ico-bad"></span>Bad</span>
						<span id="fail-count" class="panel-count">0</span>
						<span id="fail-sub" class="panel-sub"></span>
					</button>
				</div>
				<p id="tally-foot" class="tally-foot"></p>
			</div>

			<div class="player-settings">
				<label class="volume" for="volumeSlider">Volume
					<input type="range" id="volumeSlider" min="0" max="3" step="0.01" value="0.8">
					<output id="volume-pct" for="volumeSlider">27%</output>
				</label>
				<button id="toggleStats" class="switch" type="button" role="switch" aria-checked="true">
					<span class="switch-track" aria-hidden="true"></span>Show stats
				</button>
				<button id="resetStats" class="btn btn-quiet" type="button">Reset all-time</button>
			</div>
		</div>
	</section>

	<dialog id="modal" aria-labelledby="modal-title">
		<h2 id="modal-title"></h2>
		<div id="modal-content"></div>
	</dialog>

	<script type="module" src="/src/main.js"></script>
</body>

</html>
