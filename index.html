<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Pro Practice Metronome + Mastery</title>
	<style>
		:root {
			--primary: #007bff;
			--bg: #0e0e0e;
			--card: #151515;
			--text: #eee;
			--container-width: 450px;
			--success-glow: rgba(40, 167, 69, 0.2);
			--fail-glow: rgba(220, 53, 69, 0.1);
			--success-text: #28a745;
			--fail-text: #dc3545;
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font-family: system-ui, -apple-system, sans-serif;
			display: flex;
			justify-content: center;
			overflow-x: hidden;
			-webkit-tap-highlight-color: transparent;
		}

		#auth,
		#verify,
		#builder,
		#player {
			width: 100%;
			max-width: var(--container-width);
			min-height: 100vh;
			padding: 20px;
			box-sizing: border-box;
			position: relative;
		}

		#auth,
		#verify {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			text-align: center;
		}

		#auth h1,
		#verify h1 {
			letter-spacing: -1px;
			margin-bottom: 0;
		}

		#auth p,
		#verify p {
			color: #555;
			font-size: 13px;
			max-width: 320px;
			line-height: 1.5;
		}

		#auth input,
		#verify input {
			max-width: 280px;
		}

		#auth-error,
		#verify-error {
			color: var(--fail-text);
			font-size: 12px;
			min-height: 16px;
		}

		#auth-status {
			color: #555;
			font-size: 11px;
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		.auth-btn {
			background: var(--primary);
			color: white;
			border: none;
			padding: 12px 28px;
			border-radius: 25px;
			font-weight: 800;
			font-size: 13px;
			width: 100%;
			max-width: 280px;
		}

		.auth-link {
			background: none;
			border: none;
			color: #555;
			font-size: 12px;
			text-decoration: underline;
		}

		#mastery-layer {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			z-index: 1;
			pointer-events: none;
		}

		.mastery-zone {
			flex: 1;
			height: 100%;
			pointer-events: auto;
			cursor: pointer;
			transition: background 0.2s;
		}

		.success-flash {
			background: var(--success-glow);
		}

		.fail-flash {
			background: var(--fail-glow);
		}

		.stats-overlay {
			position: absolute;
			top: 70px;
			width: 100%;
			display: flex;
			justify-content: space-around;
			z-index: 5;
			pointer-events: none;
		}

		.stat-block {
			text-align: center;
		}

		.stat-label {
			font-size: 9px;
			letter-spacing: 2px;
			color: #555;
			margin-bottom: 2px;
			text-transform: uppercase;
			font-weight: 800;
		}

		.stat-val {
			font-size: 28px;
			font-weight: 800;
		}

		#success-count {
			color: var(--success-text);
			opacity: 0.9;
		}

		#fail-count {
			color: var(--fail-text);
			opacity: 0.8;
		}

		#accuracy-box {
			color: var(--primary);
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 30px;
			position: relative;
			z-index: 10;
		}

		#sync-indicator {
			font-size: 9px;
			letter-spacing: 1px;
			color: #444;
			font-weight: 800;
			text-transform: uppercase;
		}

		#sync-indicator.error {
			color: var(--fail-text);
		}

		.practice {
			border: 1px solid #333;
			padding: 20px;
			margin-bottom: 20px;
			border-radius: 16px;
			background: var(--card);
			position: relative;
		}

		.met {
			border-left: 4px solid var(--primary);
			padding: 10px 8px;
			margin: 10px 0;
			background: #1c1c1c;
			border-radius: 4px;
		}

		/* Row 1: name + remove */
		.met-name-row {
			display: grid;
			grid-template-columns: 22px 1fr 30px;
			gap: 6px;
			align-items: center;
			margin-bottom: 6px;
		}

		/* Row 2: bpm + duration + ramp toggle */
		.met-row {
			display: grid;
			grid-template-columns: 22px 1fr 1fr 60px;
			gap: 6px;
			align-items: center;
		}

		.met-ramp-row {
			display: none;
			align-items: center;
			gap: 8px;
			margin-top: 6px;
			padding-left: 28px;
			font-size: 11px;
			color: #555;
		}

		.met-ramp-row.visible {
			display: flex;
		}

		.met-ramp-row input[type="number"] {
			width: 70px;
		}

		.drag-handle {
			cursor: grab;
			color: #444;
			font-size: 14px;
			user-select: none;
			touch-action: none;
			text-align: center;
			line-height: 1;
		}

		.drag-handle:active {
			cursor: grabbing;
		}

		/* Name field — locked by default, unlocked on click */
		.met-name {
			background: #222;
			color: #fff;
			border: 1px solid transparent;
			padding: 10px 5px;
			border-radius: 8px;
			font-size: 13px;
			width: 100%;
			box-sizing: border-box;
			user-select: none;
			cursor: pointer;
			transition: border-color 0.2s;
		}

		.met-name.unlocked {
			user-select: text;
			cursor: text;
			border-color: var(--primary);
		}

		.met.dragging {
			opacity: 0.4;
		}

		.met.drag-over {
			border-left-color: #fff;
			background: #252525;
		}

		input {
			background: #222;
			color: #fff;
			border: 1px solid #444;
			padding: 10px 5px;
			border-radius: 8px;
			font-size: 13px;
			width: 100%;
			box-sizing: border-box;
		}

		#player {
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 20px;
		}

		#bpm-display {
			font-size: 85px;
			font-weight: 800;
			color: var(--primary);
			line-height: 1;
			margin: 5px 0;
			position: relative;
			z-index: 10;
		}

		.knob-container {
			width: 170px;
			height: 170px;
			position: relative;
			z-index: 10;
			cursor: ns-resize;
			touch-action: none;
		}

		.knob {
			width: 100%;
			height: 100%;
			border-radius: 50%;
			background: radial-gradient(circle at 30% 30%, #333, #111);
			border: 4px solid #252525;
			position: relative;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
			transition: transform 0.1s;
		}

		.knob-indicator {
			position: absolute;
			width: 5px;
			height: 18%;
			background: var(--primary);
			left: 50%;
			top: 8%;
			transform: translateX(-50%);
			border-radius: 10px;
		}

		.dot {
			width: 14px;
			height: 14px;
			background: #1a1a1a;
			border-radius: 50%;
			border: 1px solid #222;
			display: inline-block;
			margin: 0 5px;
		}

		.dot.active-accent {
			background: var(--primary);
			box-shadow: 0 0 15px var(--primary);
		}

		.dot.active-normal {
			background: #eee;
			box-shadow: 0 0 10px #eee;
		}

		.big-controls {
			display: flex;
			gap: 20px;
			align-items: center;
			position: relative;
			z-index: 10;
		}

		.btn-circle {
			width: 62px;
			height: 62px;
			border-radius: 50%;
			font-size: 22px;
			background: #1a1a1a;
			color: #eee;
			border: 1px solid #333;
			cursor: pointer;
		}

		.btn-play {
			width: 82px;
			height: 82px;
			background: var(--primary);
			border: none;
			font-size: 32px;
			color: white;
		}

		.bottom-meta {
			margin-top: 10px;
			width: 100%;
			z-index: 10;
		}

		.nav-btns {
			display: flex;
			justify-content: center;
			gap: 40px;
			margin-bottom: 12px;
		}

		button {
			cursor: pointer;
			transition: opacity 0.2s;
		}

		button:active {
			opacity: 0.6;
		}

		button:disabled {
			opacity: 0.3;
			cursor: default;
		}

		#modal-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.9);
			z-index: 1000;
			justify-content: center;
			align-items: center;
		}

		.modal {
			background: #151515;
			padding: 30px;
			border-radius: 20px;
			text-align: center;
			max-width: 280px;
			border: 1px solid #333;
		}

		/* Progress bar */
		#progress-bar-wrap {
			width: 100%;
			max-width: 300px;
			height: 4px;
			background: #222;
			border-radius: 2px;
			overflow: hidden;
			position: relative;
			z-index: 10;
		}

		#progress-bar {
			height: 100%;
			background: var(--primary);
			width: 100%;
			transition: width 1s linear;
			border-radius: 2px;
		}

		/* Volume slider */
		#volume-wrap {
			display: flex;
			align-items: center;
			gap: 10px;
			z-index: 10;
			width: 100%;
			max-width: 300px;
		}

		#volume-wrap span {
			font-size: 10px;
			color: #444;
			font-weight: 800;
			letter-spacing: 1px;
			white-space: nowrap;
		}

		#volumeSlider {
			-webkit-appearance: none;
			appearance: none;
			flex: 1;
			height: 4px;
			background: #333;
			border-radius: 2px;
			outline: none;
			border: none;
			padding: 0;
		}

		#volumeSlider::-webkit-slider-thumb {
			-webkit-appearance: none;
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: var(--primary);
			cursor: pointer;
		}

		#volumeSlider::-moz-range-thumb {
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: var(--primary);
			cursor: pointer;
			border: none;
		}

		/* Ramp toggle button inside met row */
		.ramp-toggle {
			background: none;
			border: 1px solid #333;
			color: #444;
			font-size: 9px;
			font-weight: 800;
			border-radius: 4px;
			padding: 4px 5px;
			letter-spacing: 0.5px;
			white-space: nowrap;
			width: 100%;
		}

		.ramp-toggle.active {
			border-color: var(--primary);
			color: var(--primary);
		}
	</style>
</head>

<body>

	<div id="modal-overlay">
		<div class="modal">
			<h3 style="margin-top:0" id="modal-title">Delete Routine?</h3>
			<div id="modal-content"></div>
		</div>
	</div>

	<!-- ───────────── Sign-in screen ───────────── -->
	<div id="auth">
		<h1>METRONOME</h1>
		<p>Sign in to sync your routines and stats across every device. Your data is private to your account.</p>
		<input id="auth-email" type="email" placeholder="Email" autocomplete="email">
		<input id="auth-password" type="password" placeholder="Password" autocomplete="current-password">
		<div id="auth-error"></div>
		<button id="auth-submit" class="auth-btn">SIGN IN</button>
		<button id="auth-toggle" class="auth-link">Need an account? Sign up</button>
		<div id="auth-status"></div>
	</div>

	<!-- ───────────── Email verification screen ───────────── -->
	<div id="verify" style="display:none">
		<h1>METRONOME</h1>
		<p id="verify-instructions">Enter the code we just emailed you to finish creating your account.</p>
		<input id="verify-code" type="text" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code">
		<div id="verify-error"></div>
		<button id="verify-submit" class="auth-btn">VERIFY</button>
		<button id="verify-resend" class="auth-link">Resend code</button>
		<button id="verify-back" class="auth-link">Back to sign in</button>
	</div>

	<div id="builder" style="display:none">
		<header>
			<h1 style="letter-spacing:-1px">METRONOME</h1>
			<div style="display:flex; align-items:center; gap:14px;">
				<span id="sync-indicator">SYNCED</span>
				<button id="addPracticeBtn" style="background: var(--primary); padding: 10px 22px; border-radius: 25px; color: white; border:none; font-weight: 800; font-size: 13px;">+ NEW</button>
			</div>
		</header>
		<div id="app"></div>
		<button id="signOutBtn" style="display:block; margin: 30px auto 0; background:none; border:none; color:#333; font-size: 11px; font-weight: 900; letter-spacing:1px;">SIGN OUT</button>
	</div>

	<div id="player">
		<div id="mastery-layer">
			<div id="success-zone" class="mastery-zone"></div>
			<div id="fail-zone" class="mastery-zone"></div>
		</div>

		<div class="stats-overlay" id="stats-ui">
			<div class="stat-block">
				<div class="stat-label">SUCCESS</div>
				<div id="success-count" class="stat-val">0</div>
			</div>
			<div class="stat-block">
				<div class="stat-label">ACC</div>
				<div id="accuracy-box" class="stat-val">0%</div>
			</div>
			<div class="stat-block">
				<div class="stat-label">FAIL</div>
				<div id="fail-count" class="stat-val">0</div>
			</div>
		</div>

		<div style="text-align: center; z-index:10;">
			<div id="label" style="font-weight: 800; letter-spacing: 2px; color: #444; font-size: 10px; margin-bottom: 10px; text-transform: uppercase;">SECTION NAME</div>
			<div class="beat-container">
				<div class="dot" id="dot-0"></div>
				<div class="dot" id="dot-1"></div>
				<div class="dot" id="dot-2"></div>
				<div class="dot" id="dot-3"></div>
			</div>
		</div>

		<div class="knob-container" id="knobContainer">
			<div class="knob" id="knob">
				<div class="knob-indicator"></div>
			</div>
		</div>

		<div style="text-align: center; z-index:10;">
			<div id="bpm-display">120</div>
			<div id="remaining" style="font-family: monospace; font-size: 24px; color: #555; font-weight: 800;">00s</div>
		</div>

		<!-- Progress bar -->
		<div id="progress-bar-wrap">
			<div id="progress-bar"></div>
		</div>

		<!-- Volume control -->
		<div id="volume-wrap">
			<span>VOL</span>
			<input type="range" id="volumeSlider" min="0" max="3" step="0.01" value="0.8">
			<span id="volume-pct">80%</span>
		</div>

		<div class="big-controls">
			<button id="minus" class="btn-circle">−</button>
			<button id="playPause" class="btn-circle btn-play">II</button>
			<button id="plus" class="btn-circle">+</button>
		</div>

		<div class="bottom-meta">
			<div class="nav-btns">
				<button id="prevBtn" style="background:none; border:none; color:#444; font-weight: 900; font-size:12px;">PREV</button>
				<button id="nextBtn" style="background:none; border:none; color:#444; font-weight: 900; font-size:12px;">NEXT</button>
			</div>
			<div id="upcoming-details" style="font-size: 10px; color: #333; text-align: center; margin-bottom: 15px; text-transform: uppercase; font-weight: 700;">--</div>

			<div style="display:flex; justify-content:center; gap:15px;">
				<button id="toggleStats" style="background:#151515; border:1px solid #333; color:#555; padding:6px 12px; border-radius:20px; font-size:9px; font-weight: 800;">STATS: ON</button>
				<button id="resetStats" style="background:#151515; border:1px solid #333; color:#555; padding:6px 12px; border-radius:20px; font-size:9px; font-weight: 800;">RESET</button>
			</div>

			<button id="stop" style="display:block; margin: 20px auto 0; background:none; border:none; color:#333; font-size: 11px; font-weight: 900; letter-spacing:1px;">EXIT</button>
		</div>
	</div>

	<script type="module" src="/src/main.js"></script>
</body>

</html>
